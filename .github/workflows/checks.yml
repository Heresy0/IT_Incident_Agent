name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  control-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
      DASHSCOPE_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_controls tests.test_identity_memory.IdentityTests tests.test_evaluation -v
      - run: python -m unittest tests.test_incident_tools tests.test_incident_investigation tests.test_incident_acceptance tests.test_incident_collaboration -v
      - run: python scripts/probe_incident_tools.py
      - run: python -m evals.incident.check_fixtures
      - run: python evals/run.py --check-fixtures
      - run: python -m compileall -q app
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/agent_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/agent_front/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  postgres-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
      RESEARCH_TEST_POSTGRES_DSN: postgresql://research:research@127.0.0.1:5432/research_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_postgres tests.test_identity_memory.MemoryPostgresTests -v
