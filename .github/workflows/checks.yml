name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  control-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
      DASHSCOPE_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - run: python scripts/probe_incident_tools.py
      - run: python -m evals.incident.check_fixtures
      - run: python scripts/showcase_incident.py
      - run: python -m compileall -q app
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/agent_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/agent_front/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  postgres-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
      INCIDENT_TEST_POSTGRES_DSN: postgresql://incident:incident@127.0.0.1:5432/incident_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident
          POSTGRES_DB: incident_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U incident -d incident_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.storage.test_incident_postgres -v
