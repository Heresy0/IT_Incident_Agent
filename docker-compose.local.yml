name: it-incident-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: deepresearch_local
      POSTGRES_DB: deepresearch
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
