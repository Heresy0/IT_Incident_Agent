name: it-incident-acceptance
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: incident_test
      POSTGRES_PASSWORD: incident_test_local
      POSTGRES_DB: incident_test
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_test -d incident_test"]
      interval: 2s
      timeout: 3s
      retries: 20
